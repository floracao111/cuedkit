<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect — Cued Kit</title>
  <link rel="stylesheet" href="css/style.css?v=20261126">
  <link rel="stylesheet" href="css/learn.css?v=20261126">
  <script src="js/lang.js?v=20261126"></script>
</head>
<body class="center-page wide-page" data-step="connect">
  <div id="browser-warning" class="banner-warning" hidden data-i18n="banner.browserWarning"></div>

  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="Cued Kit">Cued Kit</a>
    <nav class="top-nav">
      <a href="about.html" data-i18n="nav.about">About</a>
      <a href="faq.html" data-i18n="nav.faq">FAQ</a>
      <a href="contact.html" data-i18n="nav.contact">Contact</a>
    </nav>
    <div class="lang-switch">
      <button type="button" data-lang-btn="en">EN</button>
      <button type="button" data-lang-btn="zh">中文</button>
    </div>
  </header>

  <nav id="stepper" class="stepper"></nav>

  <main>
    <div class="hero">
      <h1 class="hero-title" data-i18n="connect.title">Connect Your Hand</h1>
    </div>

    <p class="note" id="connect-note" data-i18n="connect.browserNote"></p>

    <button type="button" class="btn" id="connect-btn" data-i18n="connect.connectButton">Connect</button>

    <p id="connect-status" class="connect-status" role="status" aria-live="polite"></p>

    <div class="section-list" id="connect-help">
      <section>
        <h2 data-i18n="connect.troubleshootingTitle">Troubleshooting</h2>
        <ul class="tip-list">
          <li data-i18n="connect.tip1"></li>
          <li data-i18n="connect.tip2"></li>
          <li data-i18n="connect.tip3"></li>
        </ul>
      </section>
    </div>

    <div class="files" id="hand-test" hidden></div>

    <a class="btn btn-lg" id="start-btn" href="use.html" data-i18n="connect.startButton" hidden>Start the course</a>
  </main>

  <script src="i18n/en.js?v=20261126"></script>
  <script src="i18n/zh.js?v=20261126"></script>
  <script src="js/i18n.js?v=20261126"></script>
  <script src="js/browser-check.js?v=20261126"></script>
  <script src="js/stepper.js?v=20261126"></script>
  <script src="js/hand-ui.js?v=20261126"></script>
  <script src="js/serial.js?v=20261126"></script>
  <script src="js/hand-test.js?v=20261126"></script>
  <script src="js/connect.js?v=20261126"></script>
</body>
</html>
